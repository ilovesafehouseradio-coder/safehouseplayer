name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project
        run: unzip -q safehouse-radio-app.zip -d project

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: project
        run: gradle assembleDebug --stacktrace

      - name: Name the APK
        run: cp project/app/build/outputs/apk/debug/app-debug.apk Safehouseradio.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Safehouseradio
          path: Safehouseradio.apk
          
